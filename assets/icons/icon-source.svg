<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#1B1D16" />
  <g stroke="#3A3D2E" stroke-width="2">
    <line x1="0" y1="128" x2="512" y2="128" />
    <line x1="0" y1="256" x2="512" y2="256" />
    <line x1="0" y1="384" x2="512" y2="384" />
    <line x1="128" y1="0" x2="128" y2="512" />
    <line x1="256" y1="0" x2="256" y2="512" />
    <line x1="384" y1="0" x2="384" y2="512" />
  </g>
  <!-- Mine, adapted from src/components/icons.tsx MineIcon (100x100, center 50,54),
       scaled 2.2x and translated to center on (210,320). -->
  <g fill="#E8E3D0" transform="translate(100 201.2) scale(2.2)">
    <g transform="rotate(0 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <g transform="rotate(45 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <g transform="rotate(90 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <g transform="rotate(135 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <g transform="rotate(180 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <g transform="rotate(225 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <g transform="rotate(270 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <g transform="rotate(315 50 54)">
      <rect x="47" y="20" width="6" height="14" rx="1" />
      <circle cx="50" cy="20" r="2.2" />
    </g>
    <circle cx="50" cy="54" r="19" opacity="0.4" />
    <circle cx="50" cy="54" r="19" fill="none" stroke="#E8E3D0" stroke-width="4" />
  </g>
  <!-- Flag, adapted from src/components/icons.tsx FlagIcon (100x100), scaled 2x
       and translated so it overlaps the mine's upper-right. -->
  <g transform="translate(210 90) scale(2)">
    <rect x="30" y="14" width="6" height="72" rx="1" fill="#E8E3D0" />
    <path d="M36 18 L82 34 L36 50 Z" fill="#F2793A" opacity=".85" />
    <path
      d="M36 18 L82 34 L36 50 Z"
      fill="none"
      stroke="#F2793A"
      stroke-width="2"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
  </g>
